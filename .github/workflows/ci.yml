name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version string to embed in the smoke-test image
        required: false
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - name: Verify Go module files are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Run security and drift invariant suite
        run: |
          set -euo pipefail
          invariant_regex='^(TestTamperedExportFailsVerification|TestVerifyLedgerLinksRejectsInvalidChains|TestEvidenceLedgerGenesisCheckpointHasNoPredecessor|TestEvidenceExportRejectsMixedLedgerState|TestDriftAcrossUnsupportedWindowIsReported|TestBaselinedCollectorRequiresConsecutiveUnsupportedResponses|TestBaselineIsSilent|TestRemovalRequiresTwoPolls|TestMassRemovalGuardPreservesSnapshots|TestMassRemovalGuardProtectsMajorityDisappearance|TestTenantControlledSecretNamedKeysRemainVisible|TestSecondMattermostDestinationDoesNotOverwriteTheFirst|TestDestinationLifecycleDoesNotAllowLateDeliveryBookkeeping|TestDestinationURLNeverReachesPersistedError|TestDestinationQueryCredentialsStayOutOfOutbox|TestDeliveryRedactsInjectedSenderErrors|TestDestinationURLRedactsEncodedComponents|TestDestinationTestAndUnknownMutationErrors|TestRestartMidDeliveryRecordsOutcome|TestOutboxClaimLeaseFencingAndExpiredRetry|TestClaimDueOutboxDeadLettersExpiredRowsBeforeDelivery|TestCleanupDeadLettersExpiredWebhookTriggersWithoutDeletingActiveLease|TestHasDueWebhookTriggersSkipsActiveProcessingLease|TestOpenRejectsUnversionedExistingDatabaseBeforeBootstrapDDL|TestOpenRejectsMalformedSchemaVersionBeforeBootstrapDDL|TestFinishTriggersOutlivesShutdownCancellation|TestFinishTriggersCannotOverwriteRequeuedTrigger|TestWebhookClaimLeaseFencingAndExpiredRetry|TestTriggerQueuesTargetedCollectorsAndRetainsOverflowScopes|TestFastTriggerClaimOnlyOwnsPendingDurableRows|TestDurableTriggersHaveIndependentCollectorOutcomes|TestEvidenceLedgerSurvivesHistoryRetention|TestWebhookTriggerMetadataReadIsBoundedAndValidated|TestHistoryResourceFilterTreatsWildcardsLiterally|TestSchedulerIdentityRefreshKeepsNonIdentitySettingsOnSameClient|TestPollTimerDelayHonorsEarlierCollectorDeadline|TestPollTimerDelayHandlesMissingCollectors|TestPollTimerDelayFallsBackWhenStoreUnavailable|TestIdentityChangeDeadLettersPendingEventNotifications|TestEarliestCollectorDueHandlesEmptyImmediateAndInvalidRows|TestReadinessCollectorReasonUsesBoundedVocabulary|TestStatusReportsPostBaselineCollectorDegradation|TestWebhookRetryMessageIsRedacted|TestCredentialPostsAllowProxyOriginMismatch|TestSetupPasswordMismatchConsumesThrottleBudget|TestSetupDoesNotExposeStorageErrors|TestHomeReportsStorageErrors|TestPersistedTimestampErrorsSurface|TestAbsentCollectionKeyIsNotEmpty|TestClientBoundsRetryWindow|TestSetupTokenCannotBeIssuedAfterClaim|TestResetTokenRequiresAdministrator)$'
          invariant_log="${RUNNER_TEMP:-/tmp}/tailstate-invariant-tests.log"
          go test -race -count=1 -v -run "$invariant_regex" ./... | tee "$invariant_log"
          while IFS= read -r test_name; do
            grep -E -q -- "^--- PASS: ${test_name}( |$)" "$invariant_log" || {
              echo "invariant test did not run: ${test_name}" >&2
              exit 1
            }
          done < <(grep -oE 'Test[A-Za-z0-9_]+' <<< "$invariant_regex")
      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 90.0) { printf "coverage %.1f%% is below the 90.0%% baseline\n", total; exit 1 } }'
      - run: go tool staticcheck ./...
      - run: go tool govulncheck ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: tailstate:ci
          build-args: VERSION=${{ inputs.version || 'dev' }}
      - name: Prepare pinned backup sidecar
        run: |
          set -euo pipefail
          backup_image="$(bash scripts/backup-image.sh)"
          docker pull "$backup_image"
          docker tag "$backup_image" tailstate:backup-sidecar
      - name: Scan backup sidecar
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: tailstate:backup-sidecar
          fail-build: true
          severity-cutoff: high
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: tailstate:ci
          fail-build: true
          severity-cutoff: high
      - name: Runtime smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/container-smoke.sh tailstate:ci 18080
      - name: Documented Compose startup smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/compose-smoke.sh tailstate:ci 18083
      - name: Validate HTTPS proxy Compose override
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.remote.yaml config >/tmp/tailstate-remote-compose.yaml
          grep -q 'caddy:2.11-alpine' /tmp/tailstate-remote-compose.yaml
          grep -q 'published: "80"' /tmp/tailstate-remote-compose.yaml
          grep -q 'published: "443"' /tmp/tailstate-remote-compose.yaml
          ! grep -q 'published: "8080"' /tmp/tailstate-remote-compose.yaml
      - name: HTTPS reverse-proxy runtime smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/proxy-smoke.sh tailstate:ci 18084
      - name: Backup and restore smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/container-backup-restore-smoke.sh tailstate:ci 18082
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
