name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version string to embed in the smoke-test image
        required: false
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull-request runs are cancelled; pushes to main always run to
  # completion so every main commit has a CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        # shellcheck is preinstalled on GitHub-hosted Ubuntu runners; the glob
        # keeps newly added scripts covered automatically.
        run: shellcheck --version && shellcheck -S warning scripts/*.sh
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -no-color
      - name: Lint Dockerfile
        uses: docker://hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        with:
          args: hadolint Dockerfile
      - name: Audit workflow security
        uses: docker://ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
        with:
          args: --offline --min-severity low --config .github/zizmor.yml .github/workflows
      - name: Validate example Prometheus alert rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/docs/prometheus:/rules:ro"
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          check rules /rules/alerts.yml

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tested and container Go toolchains match
        run: bash scripts/check-go-toolchain.sh
      - run: test -z "$(gofmt -l .)"
      - name: Verify Go module files are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Run security and drift invariant suite
        run: bash scripts/invariant-suite.sh
      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 90.0) { printf "coverage %.1f%% is below the 90.0%% baseline\n", total; exit 1 } }'
      - run: go tool staticcheck ./...
      - run: go tool govulncheck ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Record container build provenance
        run: |
          set -euo pipefail
          bash scripts/check-go-toolchain.sh
          printf 'container build targets: linux/amd64,linux/arm64\nsource commit: %s\n' "$GITHUB_SHA"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tailstate:ci
          cache-from: type=gha,scope=tailstate-amd64
          cache-to: type=gha,scope=tailstate-amd64,mode=max
          build-args: |
            VERSION=${{ inputs.version || 'dev' }}
            BUILD_COMMIT=${{ github.sha }}
      - name: Prepare pinned backup sidecar
        run: |
          set -euo pipefail
          backup_image="$(bash scripts/backup-image.sh)"
          docker pull "$backup_image"
          docker tag "$backup_image" tailstate:backup-sidecar
      - name: Scan backup sidecar
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tailstate:backup-sidecar
          fail-build: true
          severity-cutoff: high
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tailstate:ci
          fail-build: true
          severity-cutoff: high
      - name: Runtime smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/container-smoke.sh tailstate:ci 18080
      - name: Documented Compose startup smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/compose-smoke.sh tailstate:ci 18083
      - name: Validate HTTPS proxy Compose override (ports and egress)
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/remote-compose-check.sh
      - name: HTTPS reverse-proxy runtime smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/proxy-smoke.sh tailstate:ci 18084
      - name: Backup and restore smoke test
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/container-backup-restore-smoke.sh tailstate:ci 18082
      # The builder cross-compiles on the runner's native platform, so the
      # multi-architecture build needs no QEMU emulation.
      - name: Multi-architecture build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=tailstate-multiarch
          cache-to: type=gha,scope=tailstate-multiarch,mode=max
