name: Release container

on:
  push:
    # Semantic version tags only (v1.2.3 and pre-releases such as v1.2.3-rc.1).
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a CHANGELOG entry for the release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' entry" >&2
            exit 1
          fi
          section="$(awk -v v="## [${version}]" 'index($0, v) == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md)"
          grep -q '^- \*\*Schema:\*\*' <<< "$section" || { echo "CHANGELOG entry for ${version} lacks a Schema line" >&2; exit 1; }
          grep -q '^- \*\*Rollback:\*\*' <<< "$section" || { echo "CHANGELOG entry for ${version} lacks a Rollback line" >&2; exit 1; }
      - name: Require the tagged commit to be reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main" >&2
            exit 1
          fi

  quality:
    name: Verify release candidate
    needs: provenance
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  image:
    name: Publish verified container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless Sigstore signing of the build-provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify release toolchain and record provenance
        run: |
          set -euo pipefail
          bash scripts/check-go-toolchain.sh
          go_version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          printf 'release compiler: go%s\nrelease targets: linux/amd64,linux/arm64\nsource commit: %s\n' \
            "$go_version" "$GITHUB_SHA"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=TailState
            org.opencontainers.image.description=Read-only Tailscale inventory drift monitoring with signed evidence
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.build.targets=linux/amd64,linux/arm64
      - name: Build and push immutable release candidate
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GHCR repository paths are case-sensitive and must be lowercase;
          # github.repository preserves the mixed-case GitHub repository name.
          tags: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify release candidate manifest
        env:
          CANDIDATE_IMAGE: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_DIGEST"
          docker buildx imagetools inspect "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST" | tee /tmp/tailstate-release-candidate.txt
          grep -q 'linux/amd64' /tmp/tailstate-release-candidate.txt
          grep -q 'linux/arm64' /tmp/tailstate-release-candidate.txt
      - name: Pull immutable release candidate platforms
        env:
          CANDIDATE_IMAGE: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          manifest_json="$(docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST")"
          amd64_digest="$(jq -er '
            .manifests[]
            | select(.platform.os == "linux" and .platform.architecture == "amd64")
            | .digest
          ' <<< "$manifest_json")"
          arm64_digest="$(jq -er '
            .manifests[]
            | select(.platform.os == "linux" and .platform.architecture == "arm64")
            | .digest
          ' <<< "$manifest_json")"

          amd64_image="$CANDIDATE_IMAGE@$amd64_digest"
          arm64_image="$CANDIDATE_IMAGE@$arm64_digest"
          docker pull "$amd64_image"
          docker tag "$amd64_image" tailstate:release-candidate-amd64
          docker pull "$arm64_image"
          docker tag "$arm64_image" tailstate:release-candidate-arm64
      - name: Prepare pinned backup sidecar
        run: |
          set -euo pipefail
          backup_image="$(bash scripts/backup-image.sh)"
          docker pull "$backup_image"
          docker tag "$backup_image" tailstate:backup-sidecar
      - name: Scan backup sidecar
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tailstate:backup-sidecar
          fail-build: true
          severity-cutoff: high
      - name: Scan amd64 release candidate
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tailstate:release-candidate-amd64
          fail-build: true
          severity-cutoff: high
      - name: Scan arm64 release candidate
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tailstate:release-candidate-arm64
          fail-build: true
          severity-cutoff: high
      - name: Runtime smoke test (amd64)
        env:
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/container-smoke.sh tailstate:release-candidate-amd64 18081
      - name: Runtime smoke test (arm64)
        env:
          TAILSTATE_CONTAINER_PLATFORM: linux/arm64
          TAILSTATE_BACKUP_IMAGE: tailstate:backup-sidecar
        run: bash scripts/container-smoke.sh tailstate:release-candidate-arm64 18082
      - name: Promote verified release candidate
        id: promote
        env:
          CANDIDATE_IMAGE: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          ((${#tag_args[@]} > 0))
          # Add a promotion-only index annotation so stable tags receive a
          # distinct manifest version. This lets the final cleanup remove the
          # candidate package version without deleting the stable aliases.
          docker buildx imagetools create \
            "${tag_args[@]}" \
            --annotation "index:com.crypt0rr.tailstate.promoted-from=$CANDIDATE_DIGEST" \
            "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
          candidate_platforms="$(docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST" | jq -S '[.manifests[] | select(.platform.os and .platform.architecture) | {platform: .platform, digest: .digest}] | sort_by(.platform.os, .platform.architecture, (.platform.variant // ""))')"
          promoted_digest=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")"
            test -n "$digest"
            test "$digest" != "$CANDIDATE_DIGEST"
            if [[ -z "$promoted_digest" ]]; then
              promoted_digest="$digest"
            else
              test "$digest" = "$promoted_digest"
            fi
            promoted_platforms="$(docker buildx imagetools inspect --raw "$tag" | jq -S '[.manifests[] | select(.platform.os and .platform.architecture) | {platform: .platform, digest: .digest}] | sort_by(.platform.os, .platform.architecture, (.platform.variant // ""))')"
            test "$promoted_platforms" = "$candidate_platforms"
          done <<< "$RELEASE_TAGS"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "digest=$promoted_digest" >> "$GITHUB_OUTPUT"

      - name: Sign build provenance for the promoted image
        # Attest the promoted index digest that the version, minor, and latest
        # tags resolve to (not the candidate digest, which promotion changes).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/crypt0rr/tailstate
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

      - name: Verify the signed attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh attestation verify "oci://$tag" --owner "${GITHUB_REPOSITORY_OWNER}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done <<< "$RELEASE_TAGS"

      - name: Remove release candidate
        # The candidate is an implementation detail of this run. Remove it
        # after both successful promotion and failed validation so a broken
        # release cannot accumulate immutable GHCR versions. The digest check
        # ensures this step never attempts to delete a tag that was not pushed.
        if: ${{ always() && steps.candidate.outputs.digest != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: release-candidate-${{ github.sha }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          package_name="${PACKAGE_NAME,,}"
          owner="${GITHUB_REPOSITORY%%/*}"
          versions_path="/user/packages/container/$package_name/versions?per_page=100"
          if ! versions_json="$(gh api --paginate --slurp "$versions_path")"; then
            versions_json="$(gh api --paginate --slurp "/orgs/$owner/packages/container/$package_name/versions?per_page=100")"
          fi
          version_id="$(jq -r --arg tag "$CANDIDATE_TAG" '(add // []) | [ .[] | select((.metadata.container.tags // []) | index($tag)) | .id ] | first // empty' <<< "$versions_json")"
          if [[ -z "$version_id" ]]; then
            echo "candidate package version for $CANDIDATE_TAG is already absent"
            exit 0
          fi
          candidate_tags="$(jq -r --argjson id "$version_id" '(add // [])[] | select(.id == $id) | (.metadata.container.tags // [])[]?' <<< "$versions_json")"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            test "$tag" = "$CANDIDATE_TAG"
          done <<< "$candidate_tags"
          gh api --method DELETE "/user/packages/container/$package_name/versions/$version_id" 2>/dev/null || \
            gh api --method DELETE "/orgs/$owner/packages/container/$package_name/versions/$version_id"

  binaries:
    name: Build standalone binaries
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release artifacts are built without a restored cache.
          cache: false
      - name: Build reproducible archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p build dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="tailstate_${version}_${os}_${arch}"
            mkdir -p "build/$name/contrib/systemd"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -buildid= -X main.version=${version}" \
              -o "build/$name/tailstate" ./cmd/tailstate
            cp LICENSE README.md "build/$name/"
            if [[ -f SECURITY.md ]]; then cp SECURITY.md "build/$name/"; fi
            cp contrib/systemd/tailstate.service "build/$name/contrib/systemd/"
            tar -C build --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - "$name" \
              | gzip -n -9 > "dist/$name.tar.gz"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/tailstate_${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign build provenance for the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub release
    needs: [image, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job can write repository contents (the release itself).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; uploading missing assets"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
