name: Release container

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  image:
    name: Publish verified container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=TailState
            org.opencontainers.image.description=Read-only Tailscale inventory drift monitoring with signed evidence
            org.opencontainers.image.licenses=MIT
      - name: Build and push immutable release candidate
        id: candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GHCR repository paths are case-sensitive and must be lowercase;
          # github.repository preserves the mixed-case GitHub repository name.
          tags: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Verify release candidate manifest
        env:
          CANDIDATE_IMAGE: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_DIGEST"
          docker buildx imagetools inspect "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST" | tee /tmp/tailstate-release-candidate.txt
          grep -q 'linux/amd64' /tmp/tailstate-release-candidate.txt
          grep -q 'linux/arm64' /tmp/tailstate-release-candidate.txt
      - name: Pull immutable release candidate platforms
        env:
          CANDIDATE_IMAGE: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          manifest_json="$(docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST")"
          amd64_digest="$(jq -er '
            .manifests[]
            | select(.platform.os == "linux" and .platform.architecture == "amd64")
            | .digest
          ' <<< "$manifest_json")"
          arm64_digest="$(jq -er '
            .manifests[]
            | select(.platform.os == "linux" and .platform.architecture == "arm64")
            | .digest
          ' <<< "$manifest_json")"

          amd64_image="$CANDIDATE_IMAGE@$amd64_digest"
          arm64_image="$CANDIDATE_IMAGE@$arm64_digest"
          docker pull "$amd64_image"
          docker tag "$amd64_image" tailstate:release-candidate-amd64
          docker pull "$arm64_image"
          docker tag "$arm64_image" tailstate:release-candidate-arm64
      - name: Scan amd64 release candidate
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: tailstate:release-candidate-amd64
          fail-build: true
          severity-cutoff: high
      - name: Scan arm64 release candidate
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: tailstate:release-candidate-arm64
          fail-build: true
          severity-cutoff: high
      - name: Runtime smoke test (amd64)
        run: bash scripts/container-smoke.sh tailstate:release-candidate-amd64 18081
      - name: Runtime smoke test (arm64)
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: bash scripts/container-smoke.sh tailstate:release-candidate-arm64 18082
      - name: Promote verified release candidate
        env:
          CANDIDATE_IMAGE: ghcr.io/crypt0rr/tailstate:release-candidate-${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          ((${#tag_args[@]} > 0))
          docker buildx imagetools create "${tag_args[@]}" "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            promoted_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")"
            test "$promoted_digest" = "$CANDIDATE_DIGEST"
          done <<< "$RELEASE_TAGS"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
