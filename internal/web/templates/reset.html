{{define "title"}}Reset TailState password{{end}}
{{define "content"}}
<section class="card">
  <h1>Reset administrator password</h1>
  <p>Generate a reset token with <code>tailstate admin reset</code>. Tokens expire after 30 minutes and are single-use.</p>
  {{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/reset">
    <input type="hidden" name="_challenge" value="{{.Challenge}}">
    <label for="reset-token">Reset token
      <input id="reset-token" name="token" autocomplete="one-time-code" spellcheck="false" required>
    </label>
    <label for="reset-password">New password
      <input id="reset-password" type="password" name="password" minlength="{{.MinPasswordLength}}" autocomplete="new-password" aria-describedby="reset-password-help" required>
      <small id="reset-password-help">At least {{.MinPasswordLength}} characters; common passwords are rejected. A passphrase of several words works well.</small>
    </label>
    <label for="reset-confirm">Confirm password
      <input id="reset-confirm" type="password" name="confirm" minlength="{{.MinPasswordLength}}" autocomplete="new-password" required>
    </label>
    <button type="submit">Reset password</button>
  </form>
  <p><a href="/login">Back to login</a></p>
</section>
{{end}}
