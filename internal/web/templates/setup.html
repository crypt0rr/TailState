{{define "title"}}Claim TailState{{end}}
{{define "content"}}
<section class="card">
  <h1>Claim TailState</h1>
  <p>Enter the one-time setup token shown in the container logs, then create the administrator password. Tokens expire after 30 minutes.</p>
  {{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/setup/claim">
    <input type="hidden" name="_challenge" value="{{.Challenge}}">
    <label for="setup-token">Setup token
      <input id="setup-token" name="token" autocomplete="one-time-code" spellcheck="false" required>
    </label>
    <label for="setup-password">Administrator password
      <input id="setup-password" type="password" name="password" minlength="{{.MinPasswordLength}}" autocomplete="new-password" aria-describedby="setup-password-help" required>
      <small id="setup-password-help">At least {{.MinPasswordLength}} characters; common passwords are rejected. A passphrase of several words works well.</small>
    </label>
    <label for="setup-confirm">Confirm password
      <input id="setup-confirm" type="password" name="confirm" minlength="{{.MinPasswordLength}}" autocomplete="new-password" required>
    </label>
    <button type="submit">Claim installation</button>
  </form>
</section>
{{end}}
